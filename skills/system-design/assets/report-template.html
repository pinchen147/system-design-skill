<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System design report</title>
<style>
/* ============ Wikipedia-style type & surface system, light only ============ */
:root{
  --ink:#202122; --muted:#54595d; --faint:#72777d;
  --paper:#ffffff; --surface:#f8f9fa; --hair:#c8ccd1; --rule:#a2a9b1;
  --link:#3366cc; --link-bg:#eaf3ff;
  /* component families */
  --f-clients:#495057; --f-network:#0c8599; --f-compute:#1971c2; --f-storage:#e67700;
  --f-async:#7048e8; --f-external:#2f9e44; --f-observability:#868e96;
  --flow:#d6336c;    /* traced-path colour, distinct from every family */
  --serif:'Linux Libertine',Georgia,'Times New Roman',Times,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Lato,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.6 var(--sans)}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.3;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.45rem .7rem;border-bottom:1px solid #eaecf0;vertical-align:top}
th{font:600 .72rem/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
code,.mono{font-family:var(--mono);font-size:.86em}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:2px}
.scroll-x{overflow-x:auto}

/* ============ chrome ============ */
header.site{display:flex;align-items:baseline;gap:1rem;padding:1.3rem 1.6rem .6rem;border-bottom:3px double var(--rule)}
header.site h1{font-size:1.7rem}
header.site .date{color:var(--faint);font-size:.85rem;margin-left:auto}
nav.tabs{display:flex;gap:.1rem;padding:0 1.6rem;border-bottom:1px solid var(--hair);background:var(--surface);overflow-x:auto}
nav.tabs button{font:500 .85rem var(--sans);padding:.6rem .85rem;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--link);background:var(--paper)}
main{padding:1.2rem 1.6rem 5rem;max-width:1680px;margin:0 auto}
section[hidden]{display:none}

/* ============ cards & banners ============ */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1rem;align-items:start}
.card{background:var(--paper);border:1px solid var(--hair);border-radius:2px;padding:.9rem 1.1rem}
.card h2{font-size:1.05rem;border-bottom:1px solid var(--hair);padding-bottom:.3rem;margin-bottom:.6rem}
.reco{border:1px solid var(--link);background:var(--link-bg);border-radius:2px;padding:.9rem 1.1rem;margin-bottom:1rem}
.reco .k{font:600 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--link)}
.reco h3{font-size:1.25rem;margin:.15rem 0 .45rem}
.reco ol{margin:.2rem 0 0 1.2rem;padding:0}
.reco li{margin:.3rem 0}
.conflict{border:1px solid #e8b339;background:#fdf6e7;border-radius:2px;padding:.7rem .9rem;margin-top:.8rem}
.conflict .k{font:600 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#9a6700}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{margin:.3rem 0}
.tagrow{display:flex;flex-wrap:wrap;gap:.35rem}
.tag{font:500 .78rem var(--sans);padding:.2rem .55rem;background:var(--surface);border:1px solid var(--hair);border-radius:2px}
.prio{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin-top:.75rem}
.prio .k{font:600 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prio .tag{font-weight:600}
.prio-why{color:var(--muted);font-size:.82rem;margin:.4rem 0 0}
.dm-entity{padding:.5rem 0;border-bottom:1px solid #eaecf0}
.dm-entity:last-of-type{border-bottom:0}
.dm-entity h3{font:600 .92rem var(--sans);margin:0 0 .2rem}
.dm-field{margin:.16rem 0}
.dm-field b{font-weight:600;color:var(--muted)}
.dm-notes{margin-top:.5rem;color:var(--muted)}
.schema-section{grid-column:1/-1}
.schema-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:.75rem}
.schema-card{border:1px solid #dfe3e7;border-radius:3px;padding:.7rem .8rem;min-width:0}
.schema-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.15rem}
.schema-head h3{font:650 1rem var(--sans);margin:0}
.schema-kind{font:500 .72rem var(--mono);color:var(--faint)}
.schema-store{font-size:.78rem;color:var(--muted);margin:0 0 .45rem}
.schema-fields{list-style:none;margin:0;padding:0}
.schema-fields li{padding:.18rem 0;border-bottom:1px solid #f0f1f2;overflow-wrap:anywhere}
.schema-fields li:last-child{border-bottom:0}
.schema-field-name{font:600 .8rem var(--mono)}
.schema-field-type,.schema-field-detail{color:var(--muted);font-size:.76rem}
.schema-key{display:inline-block;font:600 .66rem var(--sans);padding:.08rem .32rem;margin-left:.25rem;background:var(--link-bg);color:var(--link);border:1px solid #b6d7ff;border-radius:2px}
.schema-meta{margin-top:.5rem;padding-top:.4rem;border-top:1px solid var(--hair);font-size:.76rem;color:var(--muted)}
.schema-meta p{margin:.2rem 0}
.interface-list{display:grid;gap:.7rem}
.interface-contract{border:1px solid #eaecf0;border-radius:2px;padding:.7rem .8rem}
.interface-head{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-bottom:.2rem}
.interface-head h3{font:600 .96rem var(--sans)}
.interface-style{font:500 .75rem var(--mono);color:var(--faint)}
.interface-purpose{margin:.1rem 0 .5rem;color:var(--muted)}
.interface-transport{margin:.15rem 0 .6rem;overflow-wrap:anywhere}
.interface-contract-summary{margin:.15rem 0 .6rem;color:var(--muted)}
.interface-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
.interface-group{border-top:1px solid var(--hair);padding-top:.4rem;min-width:0}
.interface-group h4{font:600 .72rem var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 .25rem}
.interface-group p{margin:.16rem 0;overflow-wrap:anywhere}
.interface-group b{font-weight:600;color:var(--muted)}

/* ============ architecture view ============ */
.thesis{margin:.2rem 0 .7rem;font-size:1.02rem}
.thesis b{font-family:var(--serif);font-size:1.15rem}
.thesis .style-tag{font:500 .78rem var(--mono);color:var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:.9rem;align-items:center;padding:.5rem .2rem .7rem;font-size:.8rem;color:var(--muted)}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:.35rem;vertical-align:-1px}
.legend .ek{display:inline-flex;align-items:center;gap:.35rem}
.legend svg{display:inline}
.arch-shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;height:clamp(580px,72vh,860px);border:1px solid var(--hair);border-radius:3px;background:var(--paper);overflow:hidden}
.canvas-viewport{position:relative;min-width:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;background-color:#fff;background-image:radial-gradient(#dfe3e7 .7px,transparent .7px);background-size:20px 20px}
/* A drag that escapes the viewport must not start selecting the page behind it.
   Scoped to the panning state so sidebar and report text stay selectable. */
body:has(svg.is-panning){-webkit-user-select:none;user-select:none}
.canvas-toolbar{position:absolute;z-index:8;top:.65rem;right:.65rem;display:flex;gap:.35rem}
.canvas-toolbar button{min-width:2.2rem;padding:.4rem .58rem;border:1px solid var(--hair);border-radius:4px;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.08);font:600 .78rem var(--sans)}
.canvas-toolbar button:hover{border-color:var(--rule);background:var(--surface)}
.canvas-help{position:absolute;z-index:5;left:.7rem;bottom:.55rem;margin:0;padding:.22rem .45rem;border-radius:3px;background:rgb(255 255 255/.9);color:var(--faint);font-size:.72rem;pointer-events:none}
svg.diagram{display:block;width:100%;height:100%;cursor:grab;user-select:none}
svg.diagram.is-panning{cursor:grabbing}
.cluster{stroke-width:1.5;stroke-dasharray:7 7}
.cluster-label{font:700 13px var(--sans);letter-spacing:.045em;text-transform:uppercase}
.comp{cursor:pointer}
.comp-shape{stroke-width:2.25;vector-effect:non-scaling-stroke}
.comp-mark{stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.72;vector-effect:non-scaling-stroke}
.comp .cname{font:700 14px var(--sans);fill:#111;text-anchor:middle}
.comp .ctech{font:500 10.5px var(--mono);fill:#202122;text-anchor:middle}
.comp.sel .comp-shape{stroke-width:4}
.comp.removed .comp-shape{stroke-dasharray:6 4;opacity:.55}
.comp .diffb{font:700 9.5px var(--mono)}
.edge{stroke:#69747f;fill:none;stroke-width:2;vector-effect:non-scaling-stroke}
.edge.async{stroke-dasharray:7 5}
.edge.stream{stroke-width:4}
.edge.stream-core{stroke:#fff;stroke-width:1.35}
.edge-label rect{fill:rgb(255 255 255/.94);stroke:#d8dde2;stroke-width:.75}
.edge-label text{font:600 10px var(--sans);fill:#3b4650;text-anchor:middle}
.diagram[data-detail-level="overview"] .ctech,
.diagram[data-detail-level="overview"] .edge-label.secondary,
.diagram[data-detail-level="overview"] .diffb{display:none}
svg.flow-on .comp:not(.flow-hit),svg.flow-on .edge:not(.flow-hit),svg.flow-on .edge-label:not(.flow-hit){opacity:.17;transition:opacity .2s}
svg.comp-on .comp:not(.sel):not(.adj){opacity:.34;transition:opacity .2s}
svg.comp-on .edge:not(.adj){opacity:.13}
.fseg{stroke:var(--flow);stroke-width:3.4;fill:none;vector-effect:non-scaling-stroke}
.fbadge circle{fill:var(--flow);stroke:#fff;stroke-width:1.5}
.fbadge text{fill:#fff;font:700 10.5px var(--sans);text-anchor:middle}
@media (prefers-reduced-motion:no-preference){
  .fseg{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .4s ease forwards;animation-delay:var(--d)}
  .fbadge{opacity:0;animation:pop .25s ease forwards;animation-delay:calc(var(--d) + .25s)}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{to{opacity:1}}
}
.fseg.hot{stroke-width:4}

/* flow sidebar + on-canvas inspector */
.flow-sidebar{min-width:0;border-left:1px solid var(--hair);padding:.8rem;background:#fff;overflow:auto}
.flow-sidebar h2{font-size:1.12rem;border-bottom:1px solid var(--hair);padding-bottom:.45rem;margin-bottom:.6rem}
.flow-count{float:right;color:var(--faint);font:500 .75rem var(--mono)}
.flow-list{display:flex;flex-direction:column;gap:.3rem}
.flow-list button{text-align:left;font:500 .85rem var(--sans);padding:.45rem .6rem;border:1px solid var(--hair);border-radius:2px;background:#fff}
.flow-list button:hover{background:var(--surface)}
.flow-list button[aria-pressed="true"]{border-color:var(--flow);background:#fdf0f5}
.flow-list small{display:block;color:var(--faint);font:500 .7rem var(--mono);margin-top:.08rem}
.steps{margin:.7rem 0 0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:1.5rem 1fr;gap:.5rem;padding:.4rem .3rem;border-bottom:1px solid #eaecf0}
.steps .n{font:700 .75rem var(--sans);color:var(--flow);padding-top:.12rem}
.steps .route{font:600 .8rem var(--sans)}
.steps .route .mono{color:var(--muted)}
.steps .note{color:var(--muted);font-size:.8rem;margin-top:.15rem}
.steps li:hover,.steps li:focus-within{background:#fdf0f5}
.hint{color:var(--faint);font-size:.78rem;margin-top:.6rem}
kbd{font:600 .72rem var(--mono);border:1px solid var(--hair);border-bottom-width:2px;border-radius:3px;padding:.05rem .3rem;background:var(--surface)}
/* component detail */
.component-inspector{position:absolute;z-index:7;right:1rem;bottom:1rem;width:min(350px,calc(100% - 2rem));max-height:58%;overflow:auto;padding:.85rem 1rem;background:rgb(255 255 255/.98);border:1px solid var(--rule);border-radius:6px;box-shadow:0 14px 36px rgb(0 0 0/.17)}
.component-inspector[hidden]{display:none}
.inspector-close{float:right;width:1.8rem;height:1.8rem;border:1px solid var(--hair);border-radius:3px;background:#fff;font-size:1.1rem;line-height:1}
.cdetail .head{display:flex;align-items:center;gap:.55rem;margin-bottom:.4rem}
.cdetail .chip{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:none}
.cdetail .chip svg{stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cdetail .head b{font-size:1rem}
.cdetail .meta{font:500 .74rem var(--sans);color:var(--muted);display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.cdetail .meta span{background:var(--surface);border:1px solid var(--hair);border-radius:2px;padding:.1rem .4rem}
.cdetail .what{font-size:.88rem;margin:.3rem 0 .6rem}
.cdetail h4{font:600 .72rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:.7rem 0 .3rem}
.cdetail ul{margin:0;padding:0;list-style:none;font-size:.82rem}
.cdetail ul li{padding:.2rem 0;border-bottom:1px solid #f1f2f4}
.cdetail .dir{font-weight:700;color:var(--faint)}
.cdetail .contract{margin:.25rem 0 .45rem;padding:.35rem .45rem;background:var(--surface);border-left:2px solid var(--hair);font-size:.78rem}
.cdetail .contract div+div{margin-top:.15rem}
.cdetail .contract b{color:var(--muted)}
.cdetail .fbtn{color:var(--link);text-align:left;font-size:.82rem;padding:.15rem 0}
.cdetail .fbtn:hover{text-decoration:underline}
@media (max-width:820px){
  main{padding-left:.7rem;padding-right:.7rem}
  .arch-shell{grid-template-columns:minmax(0,1fr) 220px;height:70vh}
  .flow-sidebar{padding:.6rem;font-size:.82rem}
  .canvas-help{display:none}
  .interface-groups{grid-template-columns:1fr}
}

/* ============ compare ============ */
.matrix td.dots{font-family:var(--mono);letter-spacing:.1em;white-space:nowrap;color:#b6bcc4}
.matrix td.dots .f{color:var(--f-compute)}
.matrix td.best{font-weight:700}
.matrix td.best .f{color:var(--link)}
.matrix th.arch{color:var(--ink)}
.cand-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;margin-top:1rem;align-items:start}
.cand-cards h3{font-size:1.1rem;margin-bottom:.1rem}
.cand-cards .style{font:500 .75rem var(--mono);color:var(--faint)}
.pros,.cons{margin:.45rem 0 0 1.1rem;padding:0;font-size:.85rem}
.pros li::marker{content:"+ ";color:var(--f-external)}
.cons li::marker{content:"− ";color:#c9302c}
.diffchips{margin-top:.5rem;display:flex;gap:.3rem;flex-wrap:wrap}
.dc{font:600 .74rem var(--mono);padding:.16rem .45rem;border-radius:2px;background:var(--surface);border:1px solid var(--hair)}
.dc.add{color:var(--f-external)} .dc.rem{color:#c9302c} .dc.mod{color:#9a6700}
.mig{font:500 .78rem var(--mono);margin-top:.5rem;color:var(--muted)}

#empty{max-width:520px;margin:14vh auto;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="site">
  <h1 id="rtitle">System design report</h1>
  <span class="date" id="rdate"></span>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="main"></main>
<output id="report-diagnostics" data-component-overlaps="0" data-route-collisions="0" data-text-overflows="0" data-fit-overflows="0" data-label-occlusions="0" hidden></output>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<script type="application/json" id="design-data">__DESIGN_JSON__</script>
<script>
"use strict";
/* ---------- data ---------- */
const rawEl = document.getElementById("design-data");
const rawTxt = rawEl ? rawEl.textContent.trim() : "";
let D = null;
try { if (rawTxt.startsWith("{")) D = JSON.parse(rawTxt); } catch(e){ D = null; }
const main = document.getElementById("main");
if (!D){
  main.innerHTML = '<div id="empty"><p>This is the empty report template. The <span class="mono">/system-design</span> skill injects <span class="mono">design.json</span> in place of the placeholder to produce a report.</p></div>';
  throw new Error("no data");
}

/* ---------- vocab ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AXES = ["deployability","elasticity","evolvability","faultTolerance","modularity","cost","performance","reliability","scalability","simplicity","testability"];

/* ---------- diagram geometry ---------- */
const CW=204, CH=104, BW=176, BH=72, LPAD=52, TPAD=10, BANDGAP=12;
function layout(a){
  const zones = ZONES.filter(z => (a.components||[]).some(c=>c.zone===z));
  let y = TPAD; const zoneY = {}, zoneH = {};
  for (const z of zones){
    const rows = Math.max(...a.components.filter(c=>c.zone===z).map(c=>c.grid?.row??0)) + 1;
    zoneY[z]=y; zoneH[z]=rows*CH+16; y += zoneH[z]+BANDGAP;
  }
  const cols = Math.max(...(a.components||[]).map(c=>c.grid?.col??0)) + 1;
  const W = LPAD + cols*CW + 18, H = y + 4;
  const pos = {};
  for (const c of (a.components||[])){
    const x = LPAD + (c.grid?.col??0)*CW + (CW-BW)/2;
    const yy = zoneY[c.zone] + 8 + (c.grid?.row??0)*CH + (CH-BH)/2 - 8;
    pos[c.id] = {x, y:yy, w:BW, h:BH, cx:x+BW/2, cy:yy+BH/2};
  }
  return {zones, zoneY, zoneH, W, H, pos};
}
function edgePath(p1, p2){
  // Orthogonal routing, collision-free by construction: long verticals run in
  // column gutters (always empty), horizontal runs hug the clear strip
  // above/below boxes, entries stub in from beside the target.
  const colOf = p => Math.round((p.x - LPAD - (CW-BW)/2) / CW);
  const c1 = colOf(p1), c2 = colOf(p2);
  const sameBand = Math.abs(p1.cy - p2.cy) < CH*0.6;
  if (sameBand){
    if (Math.abs(c1-c2) <= 1){
      const sx = c2>c1 ? p1.x+p1.w : p1.x, tx = c2>c1 ? p2.x-4 : p2.x+p2.w+4;
      return `M ${sx} ${p1.cy} L ${tx} ${p2.cy}`;
    }
    const stripY = Math.min(p1.y, p2.y) - 13;
    return `M ${p1.cx} ${p1.y} L ${p1.cx} ${stripY} L ${p2.cx} ${stripY} L ${p2.cx} ${p2.y-4}`;
  }
  const down = p2.cy > p1.cy;
  const sy = down ? p1.y+p1.h : p1.y;
  if (c1 === c2 && Math.abs(p2.cy-p1.cy) < CH*1.9){
    return `M ${p1.cx} ${sy} L ${p1.cx} ${down ? p2.y-4 : p2.y+p2.h+4}`;
  }
  const gapY = down ? p1.y+p1.h+13 : p1.y-13;
  const gutter = c1===c2 ? LPAD + c1*CW + 8
               : c2>c1  ? LPAD + c2*CW + 8
               :          LPAD + (c2+1)*CW - 8;
  const tx = (c1===c2 || c2>c1) ? p2.x-4 : p2.x+p2.w+4;
  return `M ${p1.cx} ${sy} L ${p1.cx} ${gapY} L ${gutter} ${gapY} L ${gutter} ${p2.cy} L ${tx} ${p2.cy}`;
}

    grp.appendChild(el("use",{href:"#i-"+(c.type||"service"),class:"icon",x:p.x+13,y:p.y+p.h/2-9,width:18,height:18}));
    const t1 = el("text",{class:"cname",x:p.x+43,y:p.y+p.h/2+(c.tech?-2:5)}); t1.textContent=c.name; grp.appendChild(t1);
    if (c.tech){ const t2=el("text",{class:"ctech",x:p.x+43,y:p.y+p.h/2+13}); t2.textContent=c.tech; grp.appendChild(t2); }
    if (c.change && c.change!=="unchanged" && D.mode==="repo"){
      const b = el("text",{class:"diffb",x:p.x+p.w-8,y:p.y+13,"text-anchor":"end",fill:diffColor[c.change]||"#54595d"});

      edgeLayer.appendChild(el("path",{
        class:"edge stream-core",
        d:route.d,
        "data-from":edge.from,
        "data-to":edge.to
      }));
    }
    if(edge.label) labelledEdges.push({edge,route});
  }
  svg.appendChild(edgeLayer);

  const componentLayer=el("g",{class:"component-layer"});
  for(const component of components){
    const box=layoutV2.boxes.get(component.id);
    if(box) componentLayer.appendChild(createComponentNodeV2(component,box));
  }
  svg.appendChild(componentLayer);

  // Edge labels paint last, so a component can never cover one, and each is
  // placed clear of the components and of the labels already down.
  const labelObstacles=[];
  for(const component of components){
    const box=layoutV2.boxes.get(component.id);
    if(box) labelObstacles.push(box);
  }
  const placedLabels=[];
  for(const item of labelledEdges){
    edgeLabelLayer.appendChild(edgeLabelV2(item.edge.label,item.route,item.edge,labelObstacles,placedLabels));
  }
  svg.appendChild(edgeLabelLayer);
  updateDiagnosticsV2();

  const flowLayer=el("g",{class:"flow-layer"});
  svg.appendChild(flowLayer);
  viewport.insertBefore(svg,viewport.firstChild);

  const camera=createCameraV2(viewport,svg,{x:0,y:0,w:layoutV2.width,h:layoutV2.height});
  const flowList=document.getElementById("flows-"+architectureId);
  const flowSteps=document.getElementById("flow-steps-"+architectureId);
  const inspector=document.getElementById("inspector-"+architectureId);
  const inspectorBody=inspector.querySelector(".inspector-body");
  let activeFlow=null,activeComponent=null;
  const componentName=id=>components.find(component=>component.id===id)?.name||id;

  function clearFlow(){
    activeFlow=null;
    svg.classList.remove("flow-on");
    flowLayer.innerHTML="";
    flowList.querySelectorAll("button[data-flow]").forEach(button=>button.setAttribute("aria-pressed","false"));
    svg.querySelectorAll(".flow-hit").forEach(node=>node.classList.remove("flow-hit"));
    flowSteps.innerHTML='<p class="hint">Choose a flow to trace it without leaving the canvas.</p>';
  }
  function closeInspector(){
    activeComponent=null;
    svg.classList.remove("comp-on");
    svg.querySelectorAll(".sel,.adj").forEach(node=>node.classList.remove("sel","adj"));
    inspector.hidden=true;
    inspectorBody.innerHTML="";
  }
  function clear(){
    clearFlow();
    closeInspector();
  }
  function selectFlow(flowId){
    const flow=flows.find(candidate=>candidate.id===flowId);
    if(!flow){clearFlow();return;}
    clearFlow();
    activeFlow=flowId;
    svg.classList.add("flow-on");
    flowList.querySelector(`[data-flow="${CSS.escape(flowId)}"]`)?.setAttribute("aria-pressed","true");
    const participatingComponents=new Set();
    (flow.steps||[]).forEach(step=>{
      participatingComponents.add(step.from);
      participatingComponents.add(step.to);
      svg.querySelectorAll(`[data-from="${CSS.escape(step.from)}"][data-to="${CSS.escape(step.to)}"]`).forEach(node=>node.classList.add("flow-hit"));
    });
    svg.querySelectorAll(".comp").forEach(node=>{
      if(participatingComponents.has(node.dataset.id)) node.classList.add("flow-hit");
    });
    (flow.steps||[]).forEach((step,index)=>{
      const sequence=step.seq??index+1;
      const route=routes.get(`${step.from}->${step.to}`)||routeOneV2(step,layoutV2,new Map());
      if(!route) return;
      const segment=el("path",{
        class:"fseg",
        d:route.d,
        "marker-end":`url(#arrow-flow-${architectureId})`,
        "data-seq":sequence
      });
      flowLayer.appendChild(segment);
      const length=segment.getTotalLength();
      segment.style.setProperty("--len",length);
      segment.style.setProperty("--d",(index*.12)+"s");
      const badgePoint=segment.getPointAtLength(length/2);
      const badge=el("g",{class:"fbadge","data-seq":sequence});
      badge.style.setProperty("--d",(index*.12)+"s");
      badge.appendChild(el("circle",{cx:badgePoint.x,cy:badgePoint.y,r:10}));
      const badgeText=el("text",{x:badgePoint.x,y:badgePoint.y+3.8});
      badgeText.textContent=sequence;
      badge.appendChild(badgeText);
      flowLayer.appendChild(badge);
    });
    flowSteps.innerHTML=`<ol class="steps">${(flow.steps||[]).map((step,index)=>{
      const sequence=step.seq??index+1;
      return `<li data-seq="${sequence}" tabindex="0"><span class="n">${sequence}</span><span><span class="route">${esc(componentName(step.from))} → ${esc(componentName(step.to))}${step.label?` <span class="mono">· ${esc(step.label)}</span>`:""}</span>${step.note?`<div class="note">${esc(step.note)}</div>`:""}</span></li>`;
    }).join("")}</ol>`;
    flowSteps.querySelectorAll("li").forEach(item=>{
      const setHot=hot=>flowLayer.querySelectorAll(`.fseg[data-seq="${CSS.escape(item.dataset.seq)}"]`).forEach(segment=>segment.classList.toggle("hot",hot));
      item.addEventListener("mouseenter",()=>setHot(true));
      item.addEventListener("mouseleave",()=>setHot(false));
      item.addEventListener("focus",()=>setHot(true));
      item.addEventListener("blur",()=>setHot(false));
    });
  }
  function selectComponent(componentId){
    const component=components.find(candidate=>candidate.id===componentId);
    if(!component){closeInspector();return;}
    closeInspector();
    activeComponent=componentId;
    svg.classList.add("comp-on");
    const adjacent=new Set([componentId]);
    edges.forEach(edge=>{
      if(edge.from===componentId||edge.to===componentId){
        adjacent.add(edge.from);
        adjacent.add(edge.to);
      }
    });
    svg.querySelectorAll(".comp").forEach(node=>{
      if(node.dataset.id===componentId) node.classList.add("sel");
      else if(adjacent.has(node.dataset.id)) node.classList.add("adj");
    });
    svg.querySelectorAll(".edge").forEach(node=>{
      if(node.dataset.from===componentId||node.dataset.to===componentId) node.classList.add("adj");
    });
    const family=FAMILY[component.type]||"compute",color=fcolor(family);
    const incoming=edges.filter(edge=>edge.to===componentId),outgoing=edges.filter(edge=>edge.from===componentId);
    const relevantFlows=flows.filter(flow=>(flow.steps||[]).some(step=>step.from===componentId||step.to===componentId));
    const state=component.state;
    const stateRows=state ? [
      ["Role",state.role],["Acknowledgement",state.acknowledgement],["Failure domain",state.failureDomain],
      ["RPO",state.rpo],["RTO",state.rto],["Source",state.source],["Cursor",state.cursor],["Recovery",state.recovery]
    ].filter(([,value])=>value!==undefined&&value!==null&&value!=="") : [];
    const contractHtml=edge=>{
      const contract=edge.contract;if(!contract) return "";
      const rows=[["Deadline",contract.deadline],["Retry owner",contract.retryOwner],["Backlog bound",contract.backlogBound]]
        .filter(([,value])=>value!==undefined&&value!==null&&value!=="");
      return rows.length?`<div class="contract">${rows.map(([label,value])=>`<div><b>${esc(label)}:</b> ${esc(value)}</div>`).join("")}</div>`:"";
    };
    const connectionHtml=(edge,direction)=>`<li><span class="dir">${direction}</span> ${esc(componentName(direction==="←"?edge.from:edge.to))}${edge.label?` <span class="mono" style="color:var(--faint)">· ${esc(edge.label)}</span>`:""} <span class="mono" style="color:var(--faint)">(${esc(edge.kind||"sync")})</span>${contractHtml(edge)}</li>`;
    inspectorBody.innerHTML=`<div class="cdetail">
      <div class="head"><span class="chip" style="background:${color}"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-${esc(component.type||"service")}"/></svg></span><b>${esc(component.name)}</b></div>
      <div class="meta"><span>${esc(TYPE_LABEL[component.type]||component.type)}</span><span>${esc(FLABEL[family])}</span>${component.tech?`<span class="mono">${esc(component.tech)}</span>`:""}${component.change&&component.change!=="unchanged"?`<span>${esc(component.change)}</span>`:""}</div>
      <p class="what">${esc(component.note||"")}</p>
      ${stateRows.length?`<h4>State contract</h4><div class="contract">${stateRows.map(([label,value])=>`<div><b>${esc(label)}:</b> ${esc(value)}</div>`).join("")}</div>`:""}
      ${(incoming.length||outgoing.length)?`<h4>Connections</h4><ul>
        ${incoming.map(edge=>connectionHtml(edge,"←")).join("")}
        ${outgoing.map(edge=>connectionHtml(edge,"→")).join("")}
      </ul>`:""}
      ${relevantFlows.length?`<h4>Appears in flows</h4><ul>${relevantFlows.map(flow=>`<li><button type="button" class="fbtn" data-flow="${esc(flow.id)}">${esc(flow.name)}</button></li>`).join("")}</ul>`:""}
    </div>`;
    inspector.hidden=false;
    inspectorBody.querySelectorAll(".fbtn").forEach(button=>button.addEventListener("click",()=>selectFlow(button.dataset.flow)));
  }

  flowList.addEventListener("click",event=>{
    const button=event.target.closest("button[data-flow]");
    if(!button) return;
    if(button.dataset.flow===activeFlow) clearFlow();else selectFlow(button.dataset.flow);
  });
  inspector.querySelector(".inspector-close").addEventListener("click",closeInspector);
  svg.addEventListener("click",event=>{
    if(camera.consumePan()) return;
    const component=event.target.closest(".comp");
    if(component){
      if(component.dataset.id===activeComponent) closeInspector();else selectComponent(component.dataset.id);
    }else closeInspector();
  });
  svg.addEventListener("keydown",event=>{
    if((event.key==="Enter"||event.key===" ")&&event.target.classList?.contains("comp")){
      event.preventDefault();
      selectComponent(event.target.dataset.id);
    }
  });
  const zoomFromCenter=factor=>{
    const bounds=viewport.getBoundingClientRect();
    camera.zoomAt(bounds.left+bounds.width/2,bounds.top+bounds.height/2,factor);
  };
  document.getElementById("zoom-out-"+architectureId).addEventListener("click",()=>zoomFromCenter(.8));
  document.getElementById("zoom-in-"+architectureId).addEventListener("click",()=>zoomFromCenter(1.25));
  document.getElementById("zoom-fit-"+architectureId).addEventListener("click",camera.fit);
  updateDiagnosticsV2();
  sec._api={
    flows,
    selectFlow,
    selectComponent,
    clear,
    fit:camera.fit,
    zoomIn:()=>zoomFromCenter(1.25),
    zoomOut:()=>zoomFromCenter(.8),
    get active(){return activeFlow;}
  };
}

/* ---------- compare ---------- */
function renderCompare(sec){
  const emph = new Set(D.comparison?.axes||[]);
  const ordered = [...AXES].sort((x,y)=>(emph.has(y)?1:0)-(emph.has(x)?1:0));
  const best = {}; for (const ax of AXES){ best[ax]=Math.max(...archs.map(a=>a.ratings?.[ax]??0)); }
  sec.innerHTML = recoBanner() + `<div class="card"><h2>Ratings matrix${emph.size?` — emphasised axes first`:""}</h2>
  <div class="scroll-x"><table class="matrix"><thead><tr><th>axis</th>${archs.map(a=>`<th class="arch">${a.id==="current"?"Current":esc(a.id.toUpperCase())}${reco.architecture===a.id?" ★":""}</th>`).join("")}</tr></thead><tbody>
  ${ordered.map(ax=>`<tr><td${emph.has(ax)?' style="font-weight:600"':""}>${AXIS_LABEL[ax]}</td>${archs.map(a=>{const v=a.ratings?.[ax];return `<td class="dots${v===best[ax]&&v!=null?" best":""}" aria-label="${v??"—"} of 5">${v==null?"—":dots(v)}</td>`;}).join("")}</tr>`).join("")}
  </tbody></table></div></div>
  <div class="cand-cards">
  ${archs.map(a=>{
    const diff = current&&a.id!=="current" ? diffChips(a) : "";
    return `<div class="card"><h3>${a.id==="current"?"Current":esc(a.id.toUpperCase())} — ${esc(a.name)}</h3><div class="style">[${esc(a.style||"")}]</div>
    <p style="font-size:.88rem;margin:.35rem 0 0">${esc(a.thesis||"")}</p>
    ${(a.tradeoffs?.pros||[]).length?`<ul class="pros">${a.tradeoffs.pros.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
    ${(a.tradeoffs?.cons||[]).length?`<ul class="cons">${a.tradeoffs.cons.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
    ${diff}
    ${a.tradeoffs?.migration?`<div class="mig">migration: ${esc(a.tradeoffs.migration.cost)} — ${esc((a.tradeoffs.migration.notes||[]).join("; "))}</div>`:""}
    </div>`;}).join("")}
  </div>`;
}
function diffChips(a){
  const cur = new Set((current.components||[]).map(c=>c.id));
  const now = new Set((a.components||[]).map(c=>c.id));
  const added=[...now].filter(x=>!cur.has(x)).length;
  const removed=[...cur].filter(x=>!now.has(x)).length;
  const modified=(a.components||[]).filter(c=>c.change==="modified").length;
  if(!added&&!removed&&!modified) return "";
  return `<div class="diffchips">${added?`<span class="dc add">+${added} added</span>`:""}${removed?`<span class="dc rem">−${removed} removed</span>`:""}${modified?`<span class="dc mod">~${modified} modified</span>`:""}</div>`;
}

/* ---------- render all sections (after every definition above) ---------- */
renderOverview(sections.overview);
for (const a of archs) renderArchV2(sections[a.id], a);
renderCompare(sections.compare);

/* ---------- routing ---------- */
const archIds = archs.map(a=>a.id);
function show(id){
  if(!sections[id]) id="overview";
  for (const t of tabDefs){ sections[t.id].hidden = t.id!==id; document.getElementById("tab-"+t.id).setAttribute("aria-selected", String(t.id===id)); }
  window.scrollTo(0,0);
  if(sections[id]?._api?.fit) requestAnimationFrame(()=>sections[id]._api.fit());
}
function cur(){ return (location.hash||"#overview").slice(1); }
window.addEventListener("hashchange", ()=>show(cur()));
show(cur());
const inspectedComponent=new URLSearchParams(location.search).get("inspect");
if(inspectedComponent) sections[cur()]?._api?.selectComponent(inspectedComponent);
function step(dir){
  const id=cur(); const i=archIds.indexOf(id);
  const next = i===-1 ? (dir>0?archIds[0]:archIds[archIds.length-1]) : archIds[(i+dir+archIds.length)%archIds.length];
  if(next) location.hash="#"+next;
}
document.addEventListener("keydown", e=>{
  if (e.target.matches("input,textarea,[contenteditable]")) return;
  if (e.key==="ArrowLeft") step(-1);
  else if (e.key==="ArrowRight") step(1);
  else if (e.key==="Escape"){ const s=sections[cur()]; s?._api?.clear(); }
  else if (e.key==="0"){ const s=sections[cur()]; s?._api?.fit(); }
  else if (e.key==="+"||e.key==="="){ const s=sections[cur()]; s?._api?.zoomIn(); }
  else if (e.key==="-"){ const s=sections[cur()]; s?._api?.zoomOut(); }
  else if (e.key==="ArrowUp"||e.key==="ArrowDown"){
    const s=sections[cur()]; const api=s?._api; if(!api||!api.flows.length) return;
    e.preventDefault();
    const ids=api.flows.map(f=>f.id); const i=ids.indexOf(api.active);
    const n = e.key==="ArrowDown" ? ids[(i+1)%ids.length] : ids[(i-1+ids.length)%ids.length];
    api.selectFlow(n);
  }
});
window.__SYSTEM_DESIGN_REPORT__={
  diagnostics:diagnosticsV2,
  sections,
  active:()=>cur()
};
</script>
